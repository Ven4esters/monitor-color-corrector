name: Python 3.12 tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      SPECTRA_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt runtime and exercise the native UI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libx11-6
          python -m pip install ".[desktop]"
          python -m spectra.desktop --check
          python -m unittest discover -v
      - name: Install with the batch launcher from a different working directory
        id: checkout_launcher
        if: runner.os == 'Windows'
        run: python .github/scripts/check_launcher.py checkout
      - name: Download and reuse the app from just one .bat file
        if: runner.os == 'Windows' && !github.event.repository.private
        run: python .github/scripts/check_launcher.py standalone
      - name: Run the native tests in the provisioned environment
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.checkout_launcher.outcome == 'success' }}
        shell: pwsh
        run: |
          $log = & .\.venv\Scripts\python.exe -m unittest discover -v 2>&1
          $rc = $LASTEXITCODE
          $log | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) {
            $tail = ($log | Select-Object -Last 26) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows test diagnostics::$message"
            exit $rc
          }
