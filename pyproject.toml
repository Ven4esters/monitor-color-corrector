[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-display-studio"
version = "1.1.1"
description = "Локальная студия согласования цвета и яркости мониторов"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.10.3"]

[project.gui-scripts]
spectra-desktop = "spectra.desktop.__main__:main"

[project.scripts]
spectra = "spectra.__main__:main"

[tool.setuptools.packages.find]
include = ["spectra*"]

[tool.setuptools.package-data]
spectra = ["web/*", "web/assets/*", "web/assets/fonts/*", "desktop/*.qss", "desktop/*.svg"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
